plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '1.4.10'
}

mainClassName = 'rt4.client'
version = '1.0.0'

sourceCompatibility = 1.8
targetCompatibility = 1.8

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly project(':deob-annotations')
    implementation project(':signlink')

    implementation 'lib:gson'
    implementation 'lib:gluegen-rt'
    implementation 'lib:gluegen-rt-natives-windows-amd64'
    implementation 'lib:gluegen-rt-natives-windows-i586'
    implementation 'lib:gluegen-rt-natives-linux-amd64'
    implementation 'lib:gluegen-rt-natives-linux-i586'
    implementation 'lib:gluegen-rt-natives-macosx-universal'
    implementation 'lib:gluegen-rt-natives-android-aarch64'
    implementation 'lib:gluegen-rt-natives-linux-aarch64'

    implementation 'lib:jogl-all'
    implementation 'lib:jogl-all-natives-linux-aarch64'
    implementation 'lib:jogl-all-natives-windows-amd64'
    implementation 'lib:jogl-all-natives-windows-i586'
    implementation 'lib:jogl-all-natives-linux-amd64'
    implementation 'lib:jogl-all-natives-linux-i586'
    implementation 'lib:jogl-all-natives-macosx-universal'
    implementation 'lib:jogl-all-natives-android-aarch64'

    runtime 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.4.10'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

jar {
    manifest {
        attributes 'Main-Class': "$mainClassName"
    }
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// AIO-11 — bake the lockdown flag into the build. `-PaiOnly=false` makes a development
// client; anything else, including no property at all, locks it (fail closed).
def aiOnly = (findProperty('aiOnly') ?: 'true').toString()

processResources {
    inputs.property('aiOnly', aiOnly)
    doLast {
        def aionlyDir = new File(destinationDir, 'rt4/aionly')
        aionlyDir.mkdirs()
        def lockdown = aiOnly.equalsIgnoreCase('false') ? 'false' : 'true'
        new File(aionlyDir, 'build.properties').text = "lockdown=${lockdown}\n"
    }
}

// AIO-15 — the AI-only release jar. `-PpublicHost=<host>` is required, `-PpublicWorld` and
// `-PrsaModulus` are optional, and the build is always locked: passing -PaiOnly=false fails.
def releaseHost = providers.gradleProperty('publicHost')
def releaseWorld = providers.gradleProperty('publicWorld').getOrElse('1')
def releaseModulus = providers.gradleProperty('rsaModulus').getOrElse('')

tasks.register('generateDefaultConfig') {
    def outputDir = layout.buildDirectory.dir('generated/aionly')
    outputs.dir(outputDir)
    doLast {
        def host = releaseHost
        if (!host.isPresent() || host.get().trim().isEmpty()) {
            throw new GradleException('releaseJar requires -PpublicHost=<host>')
        }
        def file = outputDir.get().file('rt4/aionly/default-config.json').asFile
        file.parentFile.mkdirs()
        def json = new groovy.json.JsonBuilder([
            ip_management: host.get().trim(),
            ip_address   : host.get().trim(),
            world        : releaseWorld.toInteger(),
            server_port  : 43594,
            wl_port      : 43595,
            js5_port     : 43595,
            rsa_modulus  : releaseModulus,
            mcp_enabled  : true,
            mcp_port     : 43600,
            mcp_token    : ""
        ]).toPrettyString()
        file.text = json + System.lineSeparator()
    }
}

tasks.register('releaseJar', Jar) {
    group = 'distribution'
    description = 'Builds the locked AI-only client jar with the public server baked in.'
    dependsOn tasks.named('classes'), tasks.named('generateDefaultConfig')
    archiveBaseName = 'rt4-aionly'
    archiveVersion = project.version.toString()
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    manifest {
        attributes 'Main-Class': "$mainClassName"
    }
    // No plugin sources: lockdown skips plugins anyway (AIO-11).
    from sourceSets.main.output
    from tasks.named('generateDefaultConfig')
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    doFirst {
        if (aiOnly.equalsIgnoreCase('false')) {
            throw new GradleException('releaseJar is always locked; remove -PaiOnly=false')
        }
    }
}

// The ticket asks for a build-level check that the jar really carries the AI-only files.
tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks the release jar for the lockdown flag and the baked-in host.'
    dependsOn tasks.named('releaseJar')
    doLast {
        def jar = tasks.releaseJar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def props = zip.getEntry('rt4/aionly/build.properties')
            def config = zip.getEntry('rt4/aionly/default-config.json')
            if (props == null || config == null) {
                throw new GradleException("${jar.name} is missing the AI-only resources")
            }
            def propsText = zip.getInputStream(props).getText('UTF-8')
            if (!propsText.contains('lockdown=true')) {
                throw new GradleException("${jar.name} is not locked: ${propsText.trim()}")
            }
            def host = releaseHost.get().trim()
            def configText = zip.getInputStream(config).getText('UTF-8')
            if (!configText.contains(host)) {
                throw new GradleException("${jar.name} does not bake in ${host}")
            }
        } finally {
            zip.close()
        }
    }
}
